name: Generate pacman animation

on:
  schedule: # execute every 12 hours
    - cron: "0 */12 * * *"

  workflow_dispatch:

  push:
    branches:
    - main

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: generate pacman-contribution-graph.svg
        uses: abozanona/pacman-contribution-graph@main
        with:
          github_user_name: ${{ github.repository_owner }}


      - name: push pacman-contribution-graph.svg to the output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
          # ATENCAO: este deploy SUBSTITUI o conteudo inteiro da `output`. Nao
          # ponha nada mais aqui esperando que sobreviva — em 2026-09-14 ele
          # apagou os SVGs do metrics.yml duas vezes. Esta action nao tem
          # `keep_files`, entao a saida do metrics mora na branch `metrics`.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
